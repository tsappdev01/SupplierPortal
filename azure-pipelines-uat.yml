# ---------------------------------------------------------------------------
# UAT CI/CD pipeline — on-prem IIS on UATWEB01 (self-hosted agent).
#
# Deploys the two .NET 8 web apps IN PLACE into their EXISTING IIS sites:
#   - SupplierPortal.Web         -> internal portal   : https://usupplierportal.dubaiinvestments.com/
#   - SupplierPortal.SelfService -> Partner Connect    : https://uportalconnect.dubaiinvestments.com/
#
# The self-hosted agent runs ON UATWEB01, so the deploy is a local file copy into C:\WEBSITES\<site>
# (path resolved from IIS by site name) with the app taken offline and the app pool recycled. Server-only
# state is preserved: appsettings.Local.json, doc\, keys\, logs\.
#
# This is SEPARATE from azure-pipelines.yml (which deploys to Azure App Service) — that file is unchanged.
#
# ONE-TIME SETUP in Azure DevOps:
#   1. Make sure the UATWEB01 agent is registered in an agent POOL, and put that pool's name in
#      the 'uatAgentPool' variable below (currently a placeholder).
#   2. Pipelines > New pipeline > Azure Repos Git > PartnerConnect >
#      "Existing Azure Pipelines YAML file" > select '/azure-pipelines-uat.yml'.
#   3. Prerequisites already on UATWEB01: IIS + "IIS Management Scripts and Tools",
#      the .NET 8 ASP.NET Core Hosting Bundle, and both IIS sites created under C:\WEBSITES.
#
# The agent also builds here, so it needs the .NET 8 SDK. The UseDotNet step installs it into the
# agent tool-cache on first run (needs outbound access to the Microsoft download CDN). If the box is
# offline, pre-install the .NET 8 SDK and delete the UseDotNet step — or split the Build stage onto a
# Microsoft-hosted/other build pool and keep only the Deploy job on the UATWEB01 pool.
# ---------------------------------------------------------------------------

# Manual by default — UAT is not auto-deployed on every push. To deploy automatically, uncomment the
# trigger below and set the branch (e.g. main, or a dedicated 'uat' branch).
trigger: none
# trigger:
#   branches:
#     include:
#       - main
#   paths:
#     include:
#       - src/**
#       - deploy/**
#       - azure-pipelines-uat.yml

variables:
  buildConfiguration: 'Release'
  uatAgentPool: 'REPLACE_WITH_UATWEB01_POOL_NAME'   # <-- the Azure DevOps agent pool UATWEB01 is in
  # IIS *site names* on UATWEB01 (NOT the host headers). Path + app pool are resolved from these.
  internalSiteName: 'DI Supplier'                            # -> C:\Websites\SupplierPortal (usupplierportal.dubaiinvestments.com)
  selfServiceSiteName: 'DI PORTAL'                           # -> C:\Websites\partnerconnect  (upartnerconnect.dubaiinvestments.com)
  internalUrl: 'https://usupplierportal.dubaiinvestments.com/'
  selfServiceUrl: 'https://upartnerconnect.dubaiinvestments.com/'   # confirm host: your note said 'uportalconnect', IIS binding shows 'upartnerconnect'

stages:
- stage: BuildAndDeployUAT
  displayName: Build & deploy to UAT (UATWEB01 / IIS)
  jobs:
  - job: build_deploy
    displayName: Publish both apps and deploy in place
    pool:
      name: $(uatAgentPool)      # self-hosted pool containing the UATWEB01 agent
    workspace:
      clean: outputs
    steps:
    - checkout: self
      clean: true

    # Provision the .NET 8 SDK on the agent (skip/remove if the SDK is pre-installed on UATWEB01).
    - task: UseDotNet@2
      displayName: Ensure .NET 8 SDK
      inputs:
        packageType: sdk
        version: '8.0.x'

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: 'BPPortal.sln'

    # --- Publish internal portal (framework-dependent, win-x64; runs on the Hosting Bundle) ---
    - task: DotNetCoreCLI@2
      displayName: Publish SupplierPortal.Web
      inputs:
        command: publish
        publishWebProjects: false
        projects: 'src/SupplierPortal.Web/SupplierPortal.Web.csproj'
        arguments: '--configuration $(buildConfiguration) -r win-x64 --self-contained false --no-restore --output $(Build.ArtifactStagingDirectory)/web'
        zipAfterPublish: false
        modifyOutputPath: false

    # --- Publish Partner Connect (self-service / DMZ app) ---
    - task: DotNetCoreCLI@2
      displayName: Publish SupplierPortal.SelfService
      inputs:
        command: publish
        publishWebProjects: false
        projects: 'src/SupplierPortal.SelfService/SupplierPortal.SelfService.csproj'
        arguments: '--configuration $(buildConfiguration) -r win-x64 --self-contained false --no-restore --output $(Build.ArtifactStagingDirectory)/selfservice'
        zipAfterPublish: false
        modifyOutputPath: false

    # --- Deploy internal portal in place (resolves path + app pool from the IIS site name) ---
    - task: PowerShell@2
      displayName: Deploy internal portal
      inputs:
        filePath: 'deploy/Deploy-Site-Local.ps1'
        arguments: >-
          -SiteName "$(internalSiteName)"
          -SourcePath "$(Build.ArtifactStagingDirectory)\web"
          -WarmupUrl "$(internalUrl)"
        pwsh: false   # use Windows PowerShell (WebAdministration module ships with IIS)

    # --- Deploy Partner Connect in place ---
    - task: PowerShell@2
      displayName: Deploy Partner Connect (self-service)
      inputs:
        filePath: 'deploy/Deploy-Site-Local.ps1'
        arguments: >-
          -SiteName "$(selfServiceSiteName)"
          -SourcePath "$(Build.ArtifactStagingDirectory)\selfservice"
          -WarmupUrl "$(selfServiceUrl)"
        pwsh: false
